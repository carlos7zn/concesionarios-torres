<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#1A1A1E"/>
  <rect x="100" y="75" width="200" height="150" fill="#2A2A30" rx="8"/>
  <rect x="120" y="95" width="160" height="40" fill="#3A3A40" rx="4"/>
  <rect x="120" y="150" width="100" height="8" fill="#3A3A40" rx="2"/>
  <rect x="120" y="170" height="8" fill="#3A3A40" rx="2">
    <animate attributeName="width" values="80;160;80" dur="2s" repeatCount="indefinite"/>
  </rect>
  <circle cx="150" cy="250" r="20" fill="#3A3A40"/>
  <circle cx="250" cy="250" r="20" fill="#3A3A40"/>
</svg>
